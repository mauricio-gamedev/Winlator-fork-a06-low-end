name: Build debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - a06-low-end-fork

jobs:
  assemble:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        uses: android-actions/sdkmanager@v2
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 cmake;3.22.1 ndk;24.0.8215888'

      - name: Fetch Winlator source
        run: git clone --depth 1 https://github.com/brunodev85/winlator-app.git source

      - name: Build debug APK
        run: cd source && bash gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: winlator-a06-debug
          path: source/app/build/outputs/apk/debug/*.apk
