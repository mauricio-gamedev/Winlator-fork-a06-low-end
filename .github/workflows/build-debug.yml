name: Build debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - a06-low-end-fork

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build tools
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;24.0.8215888"

      - name: Fetch Winlator source
        run: git clone --depth 1 https://github.com/brunodev85/winlator-app.git source

      - name: Apply A06 low-end defaults
        run: git -C source apply "$GITHUB_WORKSPACE/patches/a06-low-end.patch"

      - name: Build debug APK
        run: cd source && bash gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: winlator-a06-debug
          path: source/app/build/outputs/apk/debug/*.apk

      - name: Publish A06 test release
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, 'v0.2.2-a06-pack-fix') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.2-a06-pack-fix
          name: Winlator Fork A06 Low End v0.2.2 — Compatibility pack fix
          body_path: RELEASE_NOTES_v0.2.2-a06-pack-fix.md
          prerelease: true
          make_latest: false
          files: source/app/build/outputs/apk/debug/*.apk
